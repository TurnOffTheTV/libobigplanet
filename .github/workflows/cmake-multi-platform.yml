name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v7

    - name: Install macOS GCC
      if: matrix.os == 'macos-latest'
      run: |
          brew install gcc

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.c_compiler }}

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Run CTest
      working-directory: ${{github.workspace}}/build
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  build-and-test-ppc:
    name: Build and Test - PowerPC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ppc64
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Big-Endian PPC Environment
        run: |
          cat << 'EOF' > Dockerfile.ppc64
          FROM --platform=linux/ppc64 adelielinux/adelie:latest
          RUN apk update && apk add --no-cache build-base cmake make bash
          WORKDIR /workspace
          EOF
          docker buildx build --platform linux/ppc64 -t ppc64-test -f Dockerfile.ppc64 --load .

      - name: Run Tests in Big-Endian PowerPC Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ppc64-test \
            sh -c "
              cmake -S . -B build &&
              cd build &&
              make -j$(nproc) &&
              ctest --output-on-failure
            "