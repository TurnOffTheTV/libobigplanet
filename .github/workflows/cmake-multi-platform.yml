name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Install macOS GCC
        if: matrix.os == 'macos-latest'
        run: |
            brew install gcc

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.c_compiler }}

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

      - name: Run CTest
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure

  build-and-test-ppc:
    name: Build and Test - PowerPC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install Cross-Compiler and QEMU User-Mode
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-powerpc64-linux-gnu \
            gcc-powerpc64-linux-gnu \
            qemu-user \
            cmake \
            make

      - name: Configure CMake for Big-Endian PowerPC
        run: |
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=ppc64 \
            -DCMAKE_C_COMPILER=powerpc64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=powerpc64-linux-gnu-g++ \
            -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-ppc64;-L;/usr/powerpc64-linux-gnu"

      - name: Build Project
        run: |
          cmake --build build -j$(nproc)

      - name: Run Tests via QEMU
        run: |
          cd build
          ctest --output-on-failure